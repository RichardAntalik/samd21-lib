adapter driver cmsis-dap

# Filter by Arduino Leonardo's USB VID/PID (optional if it's your only probe)
cmsis_dap_vid_pid 0x2341 0x8036

# Tell OpenOCD to use SWD instead of JTAG
transport select swd

# Target configuration for SAMD21
set CHIPNAME at91samd21g18
source [find target/at91samdXX.cfg]

# Set a safe SWD clock speed (1000 kHz / 1 MHz)
adapter speed 4000
