--target=thumbv6m-mchp-none-eabi
-march=thumbv6m+nomve+nomve.fp
-mfpu=none
-mfloat-abi=soft
-fno-exceptions
-fno-rtti
-mno-unaligned-access

-B <CFGDIR>/../..

-I <CFGDIR>/../include
-I <CFGDIR>/../../include

-mmchp-ld-scripts=<CFGDIR>/ATSAMD21G17AU.ld
-mmchp-configuration-data=<CFGDIR>/configuration.data

$-mmchp-startup-files=<CFGDIR>/startup_atsamd21g17au.c
$-mmchp-startup-cfgs=<CFGDIR>/startup_atsamd21g17au.c.cfg

-D__SAMD21G17AU__

